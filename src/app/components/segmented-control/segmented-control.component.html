<div
  class="segmented-control"
  [class.fit]="fit()"
  [class.small]="size() === 'small'"
  [class.lines]="variant() === 'lines'"
  [class.swatches]="variant() === 'swatches'"
  role="radiogroup"
  [attr.aria-label]="ariaLabel() || null"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="segment"
      [class.active]="option.value === value()"
      [class.has-color]="!!option.color"
      [class.disabled]="option.disabled"
      [style.--segment-color]="option.color ?? null"
      [disabled]="option.disabled"
      role="radio"
      [attr.aria-checked]="option.value === value()"
      [attr.aria-label]="option.ariaLabel ?? (variant() === 'swatches' ? option.label : null)"
      (click)="select(option)"
    >
      @if (variant() === 'swatches' && option.color) {
        <span class="swatch-label">{{ option.label }}</span>
      } @else {
        @if (option.icon) {
          <span class="segment-icon">
            <app-icon [name]="option.icon" [size]="option.iconSize ?? 16" />
          </span>
        }
        @if (variant() === 'lines' && option.lineWidth) {
          <span
            class="line-preview"
            [style.height.px]="option.lineWidth"
          ></span>
        }
        <span>{{ option.label }}</span>
      }
    </button>
  }
</div>
