<div class="toast-host" aria-live="polite" aria-relevant="additions removals">
  @for (t of ui.toasts(); track t.id) {
    <div
      class="toast"
      [ngClass]="'toast--' + (t.type ?? 'info')"
      role="status"
    >
      <div class="toast__msg" [innerText]="t.message"></div>
      <div class="toast__actions">
        @if (t.action) {
          <button
            type="button"
            class="toast__action"
            (click)="ui.runToastAction(t.id)"
          >{{ t.action.label }}</button>
        }
        <button
          type="button"
          class="toast__close"
          aria-label="Close notification"
          (click)="ui.dismissToast(t.id)"
        >✕</button>
      </div>
    </div>
  }
</div>
