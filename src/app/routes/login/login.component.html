<h1>CROPILOT - Přihlášení</h1>

<div class="inputs">
  <label for="email">
    E-MAIL
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="auth.username"
    />
  </label>
  <label for="password">
    HESLO
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="auth.password"
    />
  </label>
</div>

@if (auth.error().length) {
  <div class="error">
    <span class="icon">
      <app-icon name="warning" [size]="16"></app-icon>
    </span>
    {{ auth.error() }}
  </div>
}

<span
  class="button real-button primary"
  tabindex="0"
  (click)="auth.login()"
>Přihlásit se</span>
