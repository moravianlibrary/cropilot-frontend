<div 
  #mainWrapper
  class="main-wrapper"
  (click)="!ui.dialogOpen() && !ui.drawerOpen() ? dashboard.selectedTitle.set(null) : null"
  (keydown)="dashboard.onKeyDown($event)"
  tabindex="0"
>
  <app-top-panel-dashboard></app-top-panel-dashboard>
  <app-main-dashboard></app-main-dashboard>
  @if (ui.drawerOpen()) {
    <div
      class="drawer-backdrop"
      (click)="dashboard.closeDrawer()"
      aria-hidden="true"
    ></div>
  }
  <app-drawer />
  <app-dialog
    [open]="ui.dialogOpen()"
    (closed)="ui.closeDialog()"
  />
</div>
