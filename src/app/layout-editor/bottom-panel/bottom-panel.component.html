<div class="left-part button-group">
  <span
    class="button secondary"
    [class.disabled]="editor.currentIndex() === 0 || !editor.displayedImagesFinal().length"
    (click)="editor.showPrevImage()"
  >
    <span class="icon">
      <app-icon name="arrow-left" [size]="16" />
    </span>
  </span>
  <span
    class="button secondary"
    [class.disabled]="editor.currentIndex() === editor.displayedImagesFinal().length - 1 || !editor.displayedImagesFinal().length"
    (click)="editor.showNextImage()"
  >
    <span class="icon">
      <app-icon name="arrow-right" [size]="16" />
    </span>
  </span>
</div>

<div class="middle-part button-group">
  <span
    class="button secondary"
    [class.disabled]="editor.viewport.scale === editor.maxZoom"
    (click)="editor.zoom('in')"
  >
    <span class="icon">
      <app-icon name="zoom-in" [size]="16" />
    </span>
  </span>
  <span
    class="button secondary"
    [class.disabled]="editor.viewport.scale <= editor.minZoom"
    (click)="editor.zoom('out')"
  >
    <span class="icon">
      <app-icon name="zoom-out" [size]="16" />
    </span>
  </span>
  <span
    class="button secondary"
    [class.disabled]="editor.viewport.scale === 1 && editor.viewport.x === 0 && editor.viewport.y === 0"
    (click)="editor.resetZoom()"
    aria-label="Přizpůsobit obrazovce"
    title="Přizpůsobit obrazovce"
  >
    <span class="icon">
      <app-icon name="fit-to-screen" [size]="16" />
    </span>
  </span>
  <span
    class="button secondary"
    [class.disabled]="!editor.currentPages.length"
    (click)="editor.fitZoomToPages()"
    aria-label="Přizpůsobit výřezům"
    title="Přizpůsobit výřezům"
  >
    <span class="icon">
      <app-icon name="fit-to-crops" [size]="16" />
    </span>
  </span>
</div>
